<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Labs Quiz</title>

<!-- Optional nicer font when online; falls back to system fonts automatically if offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #1f2330;
    --border: #2a2f3f;
    --text: #eef0f5;
    --text-dim: #9aa0ae;
    --accent: #7c5cff;
    --accent-2: #4fd1c5;
    --danger: #ff5c66;
    --success: #3ddc84;
    --warning: #ffb347;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #191d29, #0f1117 60%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
    background: rgba(23, 26, 35, 0.7);
    backdrop-filter: blur(6px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.3px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #10121a;
  }

  main {
    width: 100%;
    max-width: 760px;
    padding: 40px 20px 80px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .card h2 {
    margin-top: 0;
    font-size: 20px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: -8px;
    margin-bottom: 20px;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    resize: vertical;
  }

  input[type="file"] {
    color: var(--text-dim);
  }

  .row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 16px;
  }

  label.field-label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input[type="number"] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    width: 140px;
    font-size: 14px;
  }

  button {
    background: linear-gradient(135deg, var(--accent), #6a4bff);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:hover { transform: translateY(-1px); opacity: 0.95; }
  button:active { transform: translateY(0); }

  button.secondary {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .hidden { display: none; }

  footer {
    color: var(--text-dim);
    font-size: 12px;
    padding: 24px;
    text-align: center;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark">RA</div>
      RA Labs Quiz
    </div>
  </header>

  <main>

    <!-- SCREEN 1: Upload / Paste questions -->
    <section id="view-input" class="card">
      <h2>Start a new quiz</h2>
      <p class="subtitle">Paste your questions below, or upload a .txt file in the same format.</p>

      <textarea id="questionsInput" placeholder="Paste your formatted questions here..."></textarea>

      <div class="row">
        <input type="file" id="fileInput" accept=".txt">
      </div>

      <div class="row">
        <div>
          <label class="field-label">Quiz duration (minutes)</label>
          <input type="number" id="timerMinutes" min="1" max="180" placeholder="e.g. 20">
        </div>
      </div>

      <div class="row">
        <button id="startBtn">Start Quiz</button>
      </div>
    </section>

    <!-- SCREEN 2: Quiz (hidden for now) -->
    <section id="view-quiz" class="card hidden">
      <h2>Quiz screen placeholder</h2>
      <p class="subtitle">We'll build this next.</p>
    </section>

    <!-- SCREEN 3: Results (hidden for now) -->
    <section id="view-results" class="card hidden">
      <h2>Results screen placeholder</h2>
      <p class="subtitle">We'll build this later.</p>
    </section>

  </main>

  <footer>Built by RA Labs</footer>

</body>
</html>
